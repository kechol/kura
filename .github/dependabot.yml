version: 2
updates:
  # GitHub Actions used by the workflows in .github/workflows/.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Root Bun dependencies and the committed bun.lock.
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
    groups:
      root:
        patterns: ["*"]

  # Docs site dependencies and docs/bun.lock.
  - package-ecosystem: bun
    directory: "/docs"
    schedule:
      interval: weekly
    groups:
      docs:
        patterns: ["*"]
