name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default; no job here writes to the repo.
permissions:
  contents: read

jobs:
  check:
    name: typecheck + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # macOS needs the Homebrew SQLite keg — Apple's bundled SQLite cannot
      # load the sqlite-vec / sqlite-vaporetto extensions (docs: native-extensions.md).
      - if: runner.os == 'macOS'
        run: brew install sqlite
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      # The real vaporetto download → SHA256 → dlopen → tokenization test runs
      # on linux-x64 only (KURA_TEST_DOWNLOAD); elsewhere the suite runs offline.
      - if: runner.os == 'Linux'
        run: bun test
        env:
          KURA_TEST_DOWNLOAD: "1"
      - if: runner.os != 'Linux'
        run: bun test
      - name: Compile host binary
        run: bun run scripts/compile.ts --outfile "$RUNNER_TEMP/kura"
      - name: Smoke host binary
        shell: bash
        run: |
          export KURA_HOME="$RUNNER_TEMP/kura-smoke-home"
          "$RUNNER_TEMP/kura" init --no-download
          "$RUNNER_TEMP/kura" status
