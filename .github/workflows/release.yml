name: Release

# Triggered by pushing a `vX.Y.Z` tag (the maintainer's manual step after the
# `/release` bump PR merges). Cross-compiles every target, publishes a GitHub
# Release with the archives + SHA256SUMS, and — for stable tags with the tap's
# GitHub App configured — pushes the generated Homebrew formula to kechol/homebrew-tap.
# See docs: build-and-release.md.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

# Minimum privilege: the release job only needs to write this repo's releases.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile

      - name: Cross-compile all targets
        run: |
          for target in bun-darwin-arm64 bun-darwin-x64 bun-linux-x64 bun-linux-arm64 bun-windows-x64; do
            bun run scripts/compile.ts --target "$target" --outfile "release/$target/kura"
          done

      - name: Package archives + checksums
        run: bun run scripts/package-release.ts

      - name: Generate Homebrew formula
        env:
          TAG: ${{ github.ref_name }}
        run: bun run scripts/gen-formula.ts "$TAG" --out release/kura.rb

      - name: Detect prerelease
        id: rel
        # A hyphen in the version (e.g. v0.2.0-rc.1) marks a prerelease: it is
        # published to GitHub Releases but must not update the stable formula.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.rel.outputs.prerelease }}
        run: |
          flags=(--generate-notes)
          [[ "$PRERELEASE" == "true" ]] && flags+=(--prerelease)
          gh release create "$TAG" "${flags[@]}" \
            release/kura-*.tar.gz release/kura-*.zip release/SHA256SUMS.txt release/kura.rb

      # Stable releases only, and only when the tap's GitHub App is configured;
      # with the variable unset the formula push is skipped, not failed. The App
      # is installed only on kechol/homebrew-tap, and the token can write that
      # repository's contents and is revoked when the job ends.
      - name: Create a homebrew-tap token
        id: tap-token
        if: ${{ steps.rel.outputs.prerelease == 'false' && vars.HOMEBREW_TAP_APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.HOMEBREW_TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: kechol
          repositories: homebrew-tap
          permission-contents: write

      - name: Publish Homebrew formula
        if: ${{ steps.tap-token.outcome == 'success' }}
        env:
          TAG: ${{ github.ref_name }}
          HOMEBREW_TAP_TOKEN: ${{ steps.tap-token.outputs.token }}
        run: |
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/kechol/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp release/kura.rb tap/Formula/kura.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/kura.rb
          if git diff --cached --quiet; then
            echo "formula unchanged; nothing to push"
          else
            git commit -m "kura $TAG"
            git push
          fi
